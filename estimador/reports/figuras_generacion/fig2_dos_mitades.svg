   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="282.24" y="24.48" transform="rotate(-0 282.24 24.48)">Figura 2. Las dos mitades del generador</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(73.019367 79.069594)">feature -&gt; user story</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(73.010242 89.204047)">| role: X | funcion: Y |</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(61.860062 99.554078)">&lt;descripción&gt; | examples:</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(244.010625 80.45625)">MITAD DE ARRIBA</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(242.531875 90.9475)">mT5-small podado</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(245.3075 102.851875)">121 M · One2One</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(412.619016 79.776781)">Una historia de usuario</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(424.261945 89.512016)">As a X, I want ...,</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(437.693375 100.216781)">so that ...</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(71.645484 190.669594)">decompose story into</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(79.504961 201.596781)">tasks: &lt;historia&gt;</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(90.007836 211.024047)">| examples:</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(246.77 191.308125)">MITAD DE ABAJO</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(235.975625 202.5475)">2 mT5-small podados</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(232.888125 213.71625)">en conjunto · One2Seq</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(420.285156 190.669594)">Conjunto de tareas</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(432.041008 201.159922)">t1 ; t2 ; t3 ...</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(421.342516 211.109594)">(se juntan los dos)</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(123.892141 255.212641)">Tres modelos: uno arriba y dos abajo, entrenados por separado y con datos distintos.</text>
    <text style="font-style: italic; font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(107.767078 266.830641)">«examples:» va vacío en las dos mitades: los vecinos recuperados ya no entran en el prompt.</text>
    <text style="font-style: italic; font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(96.516766 278.64)">En las anclas, el decodificador de arriba arranca forzado con «As a X, I want to &lt;función&gt;, so that».</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="57.6" y="339.498633" transform="rotate(-0 57.6 339.498633)">texto de entrada o de salida</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="200.592" y="339.498633" transform="rotate(-0 200.592 339.498633)">red neuronal</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2d4a7c" x="33.84" y="52.80632" transform="rotate(-0 33.84 52.80632)">descripción  →  UNA historia</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #333333" x="530.64" y="52.358633" transform="rotate(-0 530.64 52.358633)">muestreo: top-p 0,95 · T 1,0 · 6 muestras o más por par (rol, clase)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2d4a7c" x="33.84" y="164.23432" transform="rotate(-0 33.84 164.23432)">historia  →  SUS tareas</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="282.24" y="243.518633" transform="rotate(-0 282.24 243.518633)">haz de 4 · sin repetir 4-gramas · penalización de repetición 1,3</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #333333" x="311.04" y="143.762555" transform="rotate(-0 311.04 143.762555)">las 12 historias elegidas</text>
