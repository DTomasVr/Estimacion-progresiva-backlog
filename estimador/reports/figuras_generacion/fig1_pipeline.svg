   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="282.24" y="168.11625" transform="rotate(-0 282.24 168.11625)">Traducir a inglés    ·    Marian opus-mt-es-en</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(182.9175 212.4075)">Planificar ROLES  (figura 3)  y  CLASES de función</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(181.26 223.35375)">2 clases por rol, P(clase | familia del rol), piso 0,10</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="282.24" y="267.7075" transform="rotate(-0 282.24 267.7075)">Recuperar vecinos del corpus real    ·    SBERT propio, k = 2</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(159.251875 312.1275)">MITAD DE ARRIBA:  descripción + fichas → una historia</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(163.039375 323.1675)">muestreo top-p 0,95 · 6 muestras por par (rol, clase)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(240.389375 368.1825)">Banco de candidatas</text>
