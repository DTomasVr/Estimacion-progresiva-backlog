   <g id="text_4">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="126" y="98.914" transform="rotate(-0 126 98.914)">Plan de roles  y  fichas de control  (rol y función)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(45.851 122.846)">Mitad de arriba</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(36.101 131.186)">una historia por ficha</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(45.5455 139.9615)">muestreo top-p</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(36.7195 164.226)">Banco de candidatas</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(32.677 172.566)">filtros de forma y de rol</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(32.016 196.134)">Selección por cobertura</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(54.5825 204.966)">de rasgos</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(158.177 137.326)">Historias ancla</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(145.7145 145.794)">una por función que la</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(150.0745 154.754)">descripción nombra</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(142.983 164.206)">el decodificador arranca</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(145.2285 172.9675)">forzado con la función;</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(149.51 182.126)">el modelo escribe el</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(167.1805 191.086)">beneficio</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(65.4045 228.534)">Fusión:  las anclas primero, hasta k/2,</text>
