    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(56.123484 154.253844)">descripción → una historia</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(262.230305 143.786328)">s2s_hist</text>
